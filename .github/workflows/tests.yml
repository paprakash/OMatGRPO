# CPU tests on a GitHub-hosted runner. Tests that need a GPU, the gated UMA model or downloads are
# marked (gpu, uma, network) and skipped here.
name: tests

on:
  workflow_dispatch:
  push:
    branches: ["main", "release"]
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-scatter==2.1.2 -f https://data.pyg.org/whl/torch-2.8.0+cpu.html
          python -m pip install -e ".[dev]"
      - name: Test
        env:
          WANDB_MODE: disabled
          CUDA_VISIBLE_DEVICES: ""
        run: python -m pytest -m "not gpu and not uma and not network" -q
